# Optional Nextflow + Slurm resource defaults (-profile slurm only).
# Beginners can ignore this file; glass_config_json.py falls back to built-in defaults if the file is missing.
# Copy or symlink to customize partition, walltime, and memory per process label.
#
# See workflows/nextflow/conf/README.md for label meanings (rosetta_initial_relax, rosetta_nogly, …).

[DEFAULT]
nextflow_slurm_time_initial_relax = 1h
nextflow_slurm_memory_initial_relax = 2.GB
nextflow_slurm_time_nogly = 8h
nextflow_slurm_memory_nogly = 2.GB
nextflow_slurm_time_glycans = 48h
nextflow_slurm_memory_glycans = 5.GB
nextflow_slurm_time_light = 30m
nextflow_slurm_memory_light = 2.GB
nextflow_slurm_queue = paul
nextflow_slurm_cluster_options =
