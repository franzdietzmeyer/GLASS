[DEFAULT]
# Name of the PDB file without .pdb extension
# The file should be located in the input_files directory
pdb_name = Hk6a_E2c3_AR3A_example

# Range of amino acid positions to process
# Format: comma-separated ranges (e.g., 1-4, 96-103, 105-150) will be processed as individual positions and processed separately
# or as grouped positions (e.g., [6,12,113]) will be processed as a group and processed together
# or as a combination of both (e.g., [6,12,113], 1-4, 96-103, 105-150) will be processed as a group and individual positions
# Please note that the script was only tested with individual positions, and the grouped positions are meant for visualisation purposes only.
# The analysis migth also not work with grouped positions.
position_ranges = surface,boundary

# Positions to exclude from processing (optional)
# Format: same as position_ranges (e.g., 10,12,99 or 10-15,99)
# Leave empty to include all positions from position_ranges.
exclude_positions =

# Chain ID on which to specified positions are located
chain_id = A

# Optional: run FastRelax on the input PDB before glycan masking. The lowest total_score
# structure is copied to results/.../initial_relax/<initial_relax_out_prefix><pdb_name>.pdb
# (see initial_relax_out_prefix). That basename is used for merged scorefiles, per-position
# scorefiles, and analysis plot names for the rest of the pipeline.
# When false, input_files/<pdb_name>.pdb is used as today.
initial_relax = false
# Initial relax only: N parallel replicates (same Rosetta command each; docker/apptainer), each with -nstruct N.
# Not the same as glycan masking nstruct below.
initial_relax_nstruct = 10
# Rosetta relax -out:prefix for decoy PDB/score rows (avoids clashing names in shared out dirs). Empty = omit flag.
initial_relax_out_prefix = r_

# Enhanced mode flag
enhanced_mode = false


# Glycan model flag: ParsedProtocol name in scripts/Glycan_Masking.xml (passed as -parser:script_vars protocol=...).
#   no_glycans         — sequon design + neighborhood relax + PTM metric; no glycan modeling (default).
#   no_glycans_forced  — same Rosetta steps as no_glycans; use for a separate results/..._no_glycans_forced/ tree.
#   glycans            — includes SimpleGlycosylateMover + GlycanTreeModeler + full relax.
#   glycans_forced     — same Rosetta steps as glycans; separate results/..._glycans_forced/ (e.g. A/B testing).
glycan_model = no_glycans

# Batch size for Rosetta glycan masking when glycan_model = glycans or glycans_forced.
# When glycans are modeled, each position can be split into multiple
# smaller Rosetta jobs (batches) to improve robustness on HPC systems.
# Set this to the number of structures per batch; the pipeline will
# automatically derive the number of batches from nstruct.
# If unset or < 1, the pipeline falls back to a single batch per position
# (equivalent to the current non-batched behavior).
glycan_batch_size = 10

# Container backend for Rosetta jobs: choose "docker" (default) or "apptainer"
# When set to "docker", GLASS will run Rosetta via `docker run` using
#   rosetta_docker_container
# When set to "apptainer", GLASS will run Rosetta via `apptainer run` using
#   rosetta_apptainer_image
container_backend = docker

# Name of the Rosetta Docker image (used when container_backend = docker)
rosetta_docker_cont = rosettacommons/rosetta:ml

# Path to the Rosetta Apptainer/Singularity image (used when container_backend = apptainer)
# Example: /path/to/rosetta_ml.sif
rosetta_apptainer_image =

#set the RSMD filter value, any design with an RSMD greater than this value will be discarded
#a lower value is more stringent
RMSD_filter = 5

#set the number of structures to generate, usually 50 is a good number to get some diveristy 
# (glycan masking only; initial relax uses initial_relax_nstruct).
nstruct = 50


# If true, append Asn sites of native N–X–S/T and enhanced [%AROMATIC]-N[^P][ST] (detected in the PDB)
# that are not already in the validated position list. Start-site exclusions: see prepare_positions.sh
# (+2, Asn−2; for valid enhanced also Asn−4; N+1=Pro cancels enhanced-specific exclusions).
add_native_sequon_starts_to_position_list = true

# -----------------------------------------------------------------------------
# Pipeline / Nextflow (sole workflow driver: ./run_glass_nextflow.sh)
# -----------------------------------------------------------------------------

# Label for this run (used in the analysis done-marker file name: .analysis_done_<label>)
pipeline_run_label = default

# Verbose prepare_positions step (boolean). Legacy key snakemake_debug is still read if pipeline_debug is absent.
pipeline_debug = false

# Max concurrent tasks on one machine (-profile local): Nextflow executor.queueSize/cpus,
# and max concurrent initial_relax replicate processes in scripts/run_initial_relax.sh (non-Nextflow helper).
# Invalid or missing values fall back to 5. Rosetta memory on local is capped in workflows/nextflow/conf/local.config.
nextflow_local_queue_size = 10

# Advanced (Slurm/HPC): walltime, memory, partition, and extra sbatch flags live in
# config/nextflow_slurm.ini (same folder as this file). Override path with env GLASS_NEXTFLOW_SLURM_INI.
