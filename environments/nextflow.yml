# Minimal Nextflow runner: OpenJDK + Nextflow only. Python/deps live in venv/GLASS (uv).
#   mamba env create -n glass-nextflow -f environments/nextflow.yml
#   mamba activate glass-nextflow
# Then: uv venv --python 3.12 venv/GLASS && source venv/GLASS/bin/activate && uv pip install -r requirements/requirements.txt
#
name: glass-nextflow
channels:
  - conda-forge
  - bioconda
dependencies:
  - openjdk >=17
  - nextflow >=24.10
